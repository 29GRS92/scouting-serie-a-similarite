<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scouting Serie A 2025/26</title>
<meta name="description" content="Compare les joueurs de Serie A 2025/26 : radar statistique, comparaison de deux joueurs et profils les plus proches au même poste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Couleurs : tout est en variables, redéfinies pour le mode sombre */
:root{
  --fond:#e9eef2; --papier:#f6f8fa; --encre:#17212b; --encre-douce:#4d5b69; --trait:#cdd6de; --case:#d3dce4;
  --a:#2f5f8f; --b:#c0580f; --accent:#1d7a5c;
}
:root[data-theme="dark"]{
  --fond:#10161c; --papier:#18212a; --encre:#e6edf3; --encre-douce:#9aa9b7; --trait:#2b3742; --case:#2a3541;
  --a:#6ea3d6; --b:#f0a35f; --accent:#4cc39a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#10161c; --papier:#18212a; --encre:#e6edf3; --encre-douce:#9aa9b7; --trait:#2b3742; --case:#2a3541;
    --a:#6ea3d6; --b:#f0a35f; --accent:#4cc39a;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--fond);color:var(--encre);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:75%;font-weight:700;letter-spacing:.005em;margin:0}
.page{max-width:1080px;margin:0 auto;padding:0 16px 64px}
/* Barre du haut : choix du poste et des joueurs */
.haut{position:sticky;top:0;z-index:5;background:var(--fond);border-bottom:1px solid var(--trait);padding:12px 0}
.titre-site{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:75%;font-weight:700;font-size:20px;margin:0 0 8px}
.titre-site span{color:var(--encre-douce);font-weight:500;font-size:15px;margin-left:8px}
.choix{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.champ{display:flex;flex-direction:column;gap:3px;min-width:0}
.champ label{font-size:13px;color:var(--encre-douce)}
select{font:inherit;font-weight:700;color:var(--encre);background:var(--papier);border:1px solid var(--trait);border-radius:6px;padding:8px 32px 8px 12px;min-width:170px;max-width:100%}
.champ.j1 select{border-left:6px solid var(--a)}
.champ.j2 select{border-left:6px solid var(--b)}
.coche{display:flex;align-items:center;gap:8px;padding-bottom:9px;font-size:15px}
.coche input{width:18px;height:18px}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--a);outline-offset:2px}
/* Joueurs */
.joueurs{display:grid;grid-template-columns:1fr;gap:28px;padding-top:32px}
.joueurs.deux{grid-template-columns:1fr 1fr}
.fiche{border-top:6px solid var(--a);padding-top:12px}
.fiche.b{border-top-color:var(--b)}
.fiche h1{font-size:clamp(36px,6vw,64px);line-height:1;font-stretch:62%}
.fiche .sous{color:var(--encre-douce);margin:6px 0 14px;font-size:17px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chiffre b{display:block;font-family:"Archivo",sans-serif;font-stretch:75%;font-size:28px;line-height:1.1}
.chiffre span{font-size:13px;color:var(--encre-douce)}
.ressemblance{margin-top:24px;padding:16px 18px;background:var(--papier);border:1px solid var(--trait);border-radius:8px}
.ressemblance b{font-family:"Archivo",sans-serif;font-stretch:75%;font-size:32px}
.barre{height:10px;background:var(--case);border-radius:5px;overflow:hidden;margin-top:8px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
section{padding-top:44px}
h2{font-size:28px;margin-bottom:6px}
.intro{color:var(--encre-douce);margin:0 0 18px;max-width:66ch}
/* Radar et tableau */
.duo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.radar{background:var(--papier);border:1px solid var(--trait);border-radius:8px;padding:8px}
.radar svg{width:100%;height:auto;display:block}
.legende{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 4px 4px;font-size:15px}
.legende i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.axes-num{margin:8px 8px 4px;padding-left:22px;font-size:14px;color:var(--encre-douce);columns:2}
.note{font-size:14px;color:var(--encre-douce);margin:10px 4px 2px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--trait)}
th{font-weight:700;color:var(--encre-douce);font-size:13px;background:transparent}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.mieux{font-weight:700}
.col-a{color:var(--a)} .col-b{color:var(--b)}
.defil{overflow-x:auto;background:var(--papier);border:1px solid var(--trait);border-radius:8px}
.defil table{min-width:520px}
.defil.stat table{min-width:0}
.defil.stat th.n{white-space:normal;line-height:1.2;vertical-align:bottom}
.defil.stat td:first-child{padding-right:4px}
button.lien{font:inherit;font-weight:700;color:var(--a);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.pc{display:flex;align-items:center;gap:8px;min-width:120px}
.pc .barre{flex:1;margin:0;height:8px}
.pc .barre i{background:var(--accent)}
details{background:var(--papier);border:1px solid var(--trait);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details table{margin-top:10px}
ul.regles{margin:0;padding-left:20px;max-width:70ch}
ul.regles li{margin:0 0 8px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--trait);color:var(--encre-douce);font-size:14px}
@media (max-width:760px){
  .duo{grid-template-columns:1fr}
  .joueurs.deux{grid-template-columns:1fr}
  .cache-mobile{display:none}
  select{min-width:0;width:100%}
  .champ{flex:1 1 100%}
  .haut{position:static}
  .chiffre b{font-size:22px}
  .defil table{min-width:0}
  .pc .barre{display:none}
  .pc{min-width:0}
  th,td{padding:7px 6px}
}
</style>
</head>
<body>
<div class="page">
  <header class="haut">
    <p class="titre-site">Scouting Serie A <span>saison 2025/26</span></p>
    <div class="choix">
      <div class="champ"><label for="poste">Poste</label><select id="poste"></select></div>
      <div class="champ j1"><label for="j1">Joueur 1</label><select id="j1"></select></div>
      <label class="coche"><input type="checkbox" id="comparer">Comparer avec un 2e joueur</label>
      <div class="champ j2" id="bloc-j2" hidden><label for="j2">Joueur 2</label><select id="j2"></select></div>
    </div>
  </header>
  <main id="contenu" aria-live="polite"></main>
  <footer>Données : Sofascore, saison 2025/26 de Serie A, joueurs ayant joué au moins <span id="seuil"></span> minutes. Les statistiques sont ramenées à 90 minutes. Le pourcentage de ressemblance compare des profils statistiques au même poste, pas le niveau des joueurs.</footer>
</div>
<script>
const D = /*DONNEES*/null;
/* Petites recettes de mise en forme à la française */
const fr = (x, d = 2) => (x === undefined || x === null || Number.isNaN(x)) ? '—' : Number(x).toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});
const fr0 = x => Number(x).toLocaleString('fr-FR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOINS_C_BIEN = ['goalsConceded_per90'];   /* statistiques où une valeur basse est favorable */

if (!D) { document.getElementById('contenu').innerHTML = '<p>Les données ne sont pas chargées.</p>'; throw new Error('pas de données'); }
document.getElementById('seuil').textContent = D.seuil_minutes;

const POSTES = Object.keys(D.postes);
const etat = {poste: POSTES[0], i1: 0, i2: null, comparer: false};
const $ = id => document.getElementById(id);

/* Lit l'adresse (?poste=&j1=&j2=) pour pouvoir partager un lien direct */
function lireAdresse() {
  const p = new URLSearchParams(location.search);
  const poste = p.get('poste');
  if (poste && D.postes[poste]) etat.poste = poste;
  const liste = D.postes[etat.poste].joueurs;
  etat.i1 = D.postes[etat.poste].defaut;
  const n1 = liste.findIndex(j => j.nom === p.get('j1'));
  if (n1 >= 0) etat.i1 = n1;
  const n2 = liste.findIndex(j => j.nom === p.get('j2'));
  if (n2 >= 0 && n2 !== etat.i1) { etat.i2 = n2; etat.comparer = true; }
}
function ecrireAdresse() {
  const liste = D.postes[etat.poste].joueurs;
  const p = new URLSearchParams({poste: etat.poste, j1: liste[etat.i1].nom});
  if (etat.comparer && etat.i2 !== null) p.set('j2', liste[etat.i2].nom);
  try { history.replaceState(null, '', '?' + p.toString()); } catch (e) { /* ouverture en fichier local : on ignore */ }
}

/* Remplit les listes déroulantes */
function remplirListes() {
  $('poste').innerHTML = POSTES.map(p => `<option ${p === etat.poste ? 'selected' : ''}>${esc(p)}</option>`).join('');
  const liste = D.postes[etat.poste].joueurs;
  $('j1').innerHTML = liste.map((j, i) => `<option value="${i}" ${i === etat.i1 ? 'selected' : ''}>${esc(j.nom)} (${esc(j.equipe)})</option>`).join('');
  if (etat.comparer && (etat.i2 === null || etat.i2 === etat.i1)) etat.i2 = liste.findIndex((j, i) => i !== etat.i1);
  $('j2').innerHTML = liste.map((j, i) => i === etat.i1 ? '' : `<option value="${i}" ${i === etat.i2 ? 'selected' : ''}>${esc(j.nom)} (${esc(j.equipe)})</option>`).join('');
  $('comparer').checked = etat.comparer;
  $('bloc-j2').hidden = !etat.comparer;
}

/* Valeur d'un axe du radar ramenée sur 100 par rapport au meilleur du poste */
function sur100(joueur, col, maxima) {
  const v = joueur.stats[col];
  const m = maxima[col] || 1;
  return v === undefined ? 0 : Math.max(0, Math.min(100, v / m * 100));
}

/* Dessin du radar en SVG (étiquettes en clair sur grand écran, numéros sur petit écran) */
function dessinerRadar(axes, jeux, etroit) {
  const n = axes.length;
  const W = etroit ? 420 : 720, H = etroit ? 420 : 540;
  const cx = W / 2, cy = H / 2, R = etroit ? 150 : 172;
  const ang = i => -Math.PI / 2 + 2 * Math.PI * i / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar statistique">`;
  [25, 50, 75, 100].forEach(k => {
    const pts = axes.map((_, i) => pt(i, R * k / 100).join(',')).join(' ');
    s += `<polygon points="${pts}" fill="none" stroke="var(--trait)" stroke-width="1"/>`;
  });
  s += `<text x="${cx + 4}" y="${cy - R * .5 + 12}" font-size="11" fill="var(--encre-douce)">50</text>`;
  s += `<text x="${cx + 4}" y="${cy - R + 12}" font-size="11" fill="var(--encre-douce)">100</text>`;
  axes.forEach((a, i) => {
    const [x, y] = pt(i, R);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--trait)" stroke-width="1"/>`;
    const c = Math.cos(ang(i));
    const [lx, ly] = pt(i, R + (etroit ? 16 : 14));
    const ancre = etroit ? 'middle' : (c > .25 ? 'start' : (c < -.25 ? 'end' : 'middle'));
    const texte = etroit ? String(i + 1) : a[0].replace(' /90', '');
    s += `<text x="${lx}" y="${ly}" text-anchor="${ancre}" dominant-baseline="middle" font-size="${etroit ? 15 : 16}" font-weight="${etroit ? 700 : 500}" fill="var(--encre)">${esc(texte)}</text>`;
  });
  jeux.forEach(j => {
    const pts = j.valeurs.map((v, i) => pt(i, R * v / 100).join(',')).join(' ');
    s += `<polygon points="${pts}" fill="${j.couleur}" fill-opacity=".2" stroke="${j.couleur}" stroke-width="2.5" stroke-linejoin="round"/>`;
    j.valeurs.forEach((v, i) => {
      const [x, y] = pt(i, R * v / 100);
      s += `<circle cx="${x}" cy="${y}" r="4" fill="${j.couleur}"><title>${esc(j.nom)} : ${esc(axes[i][0])} = ${fr(j.brut[i])} (${fr(v, 0)} sur 100)</title></circle>`;
    });
  });
  return s + '</svg>';
}

/* Fiche d'un joueur */
function fiche(j, p, classe) {
  return `<div class="fiche ${classe}">
    <h1>${esc(j.nom)}</h1>
    <p class="sous">${esc(j.equipe)} · ${esc(p)} · né en ${j.annee}</p>
    <div class="chiffres">
      <div class="chiffre"><b>${fr0(j.minutes)}</b><span>minutes</span></div>
      <div class="chiffre"><b>${j.matchs}</b><span>matchs</span></div>
      <div class="chiffre"><b>${j.titularisations}</b><span>titularisations</span></div>
    </div></div>`;
}

/* Page complète */
function afficher() {
  const bloc = D.postes[etat.poste];
  const liste = bloc.joueurs;
  const A = liste[etat.i1];
  const B = (etat.comparer && etat.i2 !== null) ? liste[etat.i2] : null;
  const axes = bloc.radar;
  const etroit = window.innerWidth < 640;
  const jeux = [{nom: A.nom, couleur: 'var(--a)', valeurs: axes.map(a => sur100(A, a[1], bloc.maxima)), brut: axes.map(a => A.stats[a[1]])}];
  if (B) jeux.push({nom: B.nom, couleur: 'var(--b)', valeurs: axes.map(a => sur100(B, a[1], bloc.maxima)), brut: axes.map(a => B.stats[a[1]])});

  let h = `<div class="joueurs ${B ? 'deux' : ''}">${fiche(A, etat.poste, '')}${B ? fiche(B, etat.poste, 'b') : ''}</div>`;
  if (B) {
    const r = bloc.ressemblance[etat.i1][etat.i2];
    h += `<div class="ressemblance"><span>Ressemblance entre ${esc(A.nom)} et ${esc(B.nom)}</span><br><b>${fr(r, 1)} %</b><div class="barre"><i style="width:${r}%"></i></div></div>`;
  }

  /* Radar et tableau des statistiques */
  const legende = `<div class="legende"><span><i style="background:var(--a)"></i>${esc(A.nom)}</span>${B ? `<span><i style="background:var(--b)"></i>${esc(B.nom)}</span>` : ''}</div>`;
  const numeros = etroit ? `<ol class="axes-num">${axes.map(a => `<li>${esc(a[0].replace(' /90', ''))}</li>`).join('')}</ol>` : '';
  const lignes = axes.map((a, i) => {
    const va = A.stats[a[1]], vb = B ? B.stats[a[1]] : null;
    let ca = '', cb = '';
    if (B && va !== undefined && vb !== undefined && va !== vb) {
      const aMieux = MOINS_C_BIEN.includes(a[1]) ? va < vb : va > vb;
      ca = aMieux ? 'mieux' : ''; cb = aMieux ? '' : 'mieux';
    }
    return `<tr><td>${etroit ? (i + 1) + '. ' : ''}${esc(a[0])}</td><td class="n ${ca}">${fr(va)}</td>${B ? `<td class="n ${cb}">${fr(vb)}</td>` : ''}</tr>`;
  }).join('');
  const noteGardien = etat.poste === 'Gardien' ? '<p class="note">Pour les buts encaissés, une valeur haute est défavorable. Les clean sheets sont un total de saison.</p>' : '';
  h += `<section id="profil"><h2>Profil statistique</h2>
    <p class="intro">Chaque axe est ramené sur 100 par rapport au meilleur joueur du même poste : 100 veut dire « le meilleur de son poste sur cette statistique ». Les valeurs sont par 90 minutes.</p>
    <div class="duo">
      <div class="radar">${dessinerRadar(axes, jeux, etroit)}${legende}${numeros}</div>
      <div class="defil stat"><table><thead><tr><th>Statistique</th><th class="n col-a">${esc(A.nom)}</th>${B ? `<th class="n col-b">${esc(B.nom)}</th>` : ''}</tr></thead><tbody>${lignes}</tbody></table></div>
    </div>${noteGardien}</section>`;

  /* Profils les plus proches du joueur 1 */
  const ligneR = bloc.ressemblance[etat.i1];
  const proches = liste.map((j, i) => ({j, i, r: ligneR[i]})).filter(x => x.i !== etat.i1).sort((x, y) => y.r - x.r).slice(0, 10);
  h += `<section id="proches"><h2>Profils les plus proches de ${esc(A.nom)}</h2>
    <p class="intro">Les 10 joueurs du même poste dont le profil statistique ressemble le plus à celui de ${esc(A.nom)}. Cliquer sur un nom le compare avec ${esc(A.nom)}.</p>
    <div class="defil"><table><thead><tr><th>Joueur</th><th>Ressemblance</th><th class="cache-mobile n">Né en</th><th>Équipe</th><th class="n">Minutes</th><th class="cache-mobile n">Matchs</th><th class="cache-mobile n">Titularisations</th></tr></thead><tbody>
    ${proches.map(x => `<tr><td><button class="lien" data-i="${x.i}">${esc(x.j.nom)}</button></td><td><div class="pc"><span>${fr(x.r, 1)} %</span><div class="barre"><i style="width:${x.r}%"></i></div></div></td><td class="n cache-mobile">${x.j.annee}</td><td>${esc(x.j.equipe)}</td><td class="n">${fr0(x.j.minutes)}</td><td class="n cache-mobile">${x.j.matchs}</td><td class="n cache-mobile">${x.j.titularisations}</td></tr>`).join('')}
    </tbody></table></div></section>`;

  /* Toutes les statistiques */
  const cles = Object.keys(A.stats).sort();
  h += `<section id="brut"><details><summary>Voir toutes les statistiques</summary>
    <table><thead><tr><th>Statistique</th><th class="n col-a">${esc(A.nom)}</th>${B ? `<th class="n col-b">${esc(B.nom)}</th>` : ''}</tr></thead><tbody>
    ${cles.map(c => `<tr><td>${esc(c)}</td><td class="n">${fr(A.stats[c], 3)}</td>${B ? `<td class="n">${fr(B.stats[c], 3)}</td>` : ''}</tr>`).join('')}
    </tbody></table></details></section>`;

  /* Comment lire */
  h += `<section id="lecture"><h2>Comment lire cette page</h2><ul class="regles">
    <li><b>Le pourcentage de ressemblance</b> compare la forme du profil statistique de deux joueurs du même poste : 100 % veut dire un profil identique, 50 % aucun lien. Il ne mesure pas le niveau : deux joueurs à 95 % peuvent ne pas se valoir.</li>
    <li><b>Les postes sont larges</b> (attaquant, milieu, défenseur, gardien) : un ailier et un avant centre sont comparés ensemble.</li>
    <li><b>Le contexte d'équipe pèse sur les chiffres</b> : un joueur d'une équipe qui domine touche plus de ballons qu'un joueur d'une équipe qui défend.</li>
    <li><b>Seuil de ${D.seuil_minutes} minutes</b> : les joueurs qui ont peu joué ne sont pas dans la liste.</li>
  </ul></section>`;

  $('contenu').innerHTML = h;
  document.querySelectorAll('button.lien').forEach(b => b.addEventListener('click', () => {
    etat.comparer = true; etat.i2 = Number(b.dataset.i);
    remplirListes(); afficher(); ecrireAdresse();
    $('profil').scrollIntoView({behavior: 'smooth'});
  }));
  document.title = A.nom + (B ? ' et ' + B.nom : '') + ' · Scouting Serie A 2025/26';
}

/* Réactions aux choix */
$('poste').addEventListener('change', e => { etat.poste = e.target.value; etat.i1 = D.postes[etat.poste].defaut; etat.i2 = null; remplirListes(); afficher(); ecrireAdresse(); });
$('j1').addEventListener('change', e => { etat.i1 = Number(e.target.value); remplirListes(); afficher(); ecrireAdresse(); });
$('j2').addEventListener('change', e => { etat.i2 = Number(e.target.value); afficher(); ecrireAdresse(); });
$('comparer').addEventListener('change', e => { etat.comparer = e.target.checked; if (!etat.comparer) etat.i2 = null; remplirListes(); afficher(); ecrireAdresse(); });
let largeur = window.innerWidth;
window.addEventListener('resize', () => { if ((largeur < 640) !== (window.innerWidth < 640)) { largeur = window.innerWidth; afficher(); } largeur = window.innerWidth; });

lireAdresse(); remplirListes(); afficher();
</script>
</body>
</html>
